<div class="retro-background">
    <div class="y2k-grid">
        <div class="grid-dots"></div>
        <div class="scanner-lines">
            <div class="scan-line scan-1"></div>
            <div class="scan-line scan-2"></div>
            <div class="scan-line scan-3"></div>
        </div>
    </div>
    <div class="floating-orbs">
        <div class="retro-orb orb-1"></div>
        <div class="retro-orb orb-2"></div>
        <div class="retro-orb orb-3"></div>
    </div>
</div>

<div class="login-container">
    <div class="future-card">
        <div class="chrome-header">
            <div class="retro-logo">
                <div class="logo-chrome">
                    <div class="chrome-inner">

                        <!-- SVG LOGO -->
                        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                            <circle cx="18" cy="18" r="16" stroke="url(#retroGradient)" stroke-width="2" />
                            <circle cx="18" cy="18" r="10" fill="url(#chromeGradient)" />
                            <circle cx="18" cy="18" r="6" fill="url(#centerGradient)" />

                            <defs>
                                <linearGradient id="retroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#ff00ff" />
                                    <stop offset="50%" style="stop-color:#00ffff" />
                                    <stop offset="100%" style="stop-color:#ffff00" />
                                </linearGradient>

                                <radialGradient id="chromeGradient">
                                    <stop offset="0%" style="stop-color:#e6e6fa" />
                                    <stop offset="100%" style="stop-color:#c0c0ff" />
                                </radialGradient>

                                <radialGradient id="centerGradient">
                                    <stop offset="0%" style="stop-color:#ffffff" />
                                    <stop offset="100%" style="stop-color:#f0f0ff" />
                                </radialGradient>
                            </defs>

                        </svg>
                    </div>
                </div>
            </div>

            <div class="login-container">
                <h2>Login</h2>

                <form (ngSubmit)="login()">

                    <label>Email</label>
                    <input type="email" [(ngModel)]="email" name="email" />

                    <label>Password</label>
                    <input type="password" [(ngModel)]="password" name="password" />

                    <button type="submit" [disabled]="loading">
                        {{ loading ? 'Please wait...' : 'Login' }}
                    </button>

                    <p style="color: red; margin-top: 10px;" *ngIf="errorMsg">
                        {{ errorMsg }}
                    </p>

                </form>
            </div>
        </div>
    </div>
</div>
