<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please enter your details to sign in</p>
        </div>

        <form (ngSubmit)="login()">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email"
                    required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password"
                    placeholder="Enter your password" required />
            </div>

            <div class="form-actions">
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" [disabled]="loading" class="login-btn">
                <span *ngIf="!loading">Sign In</span>
                <span *ngIf="loading">Signing in...</span>
            </button>

            <div *ngIf="errorMsg" class="error-message">
                {{ errorMsg }}
            </div>
        </form>

        <div class="login-footer">
            <p>Don't have an account? <a routerLink="/signin">Sign up</a></p>
        </div>
    </div>
</div>
