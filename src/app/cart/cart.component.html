<div class="container" *ngIf="cartItems$ | async as cartItems">
    <div *ngIf="cartItems.length > 0; else emptyCart">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of cartItems">
                        <td>
                            <div class="product-info">
                                <img [src]="item.imageUrl" alt="{{item.name}}" class="product-img"
                                    *ngIf="item.imageUrl">
                                <span>{{ item.name }}</span>
                            </div>
                        </td>
                        <td>{{ item.price | currency:'INR' }}</td>
                        <td>
                            <div class="quantity-controls">
                                <button (click)="decreaseQuantity(item)">-</button>
                                <span>{{ item.quantity }}</span>
                                <button (click)="increaseQuantity(item)">+</button>
                            </div>
                        </td>
                        <td>{{ item.price * item.quantity | currency:'INR' }}</td>
                        <td>
                            <button class="remove-btn" (click)="removeItem(item.id)">Remove</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="cart-summary">
            <h3>Total: {{ totalPrice | currency:'INR' }}</h3>
            <div class="actions">
                <button class="clear-btn" (click)="clearCart()">Clear Cart</button>
                <button class="checkout-btn">Checkout</button>
            </div>
        </div>
    </div>

    <ng-template #emptyCart>
        <div class="empty-cart">
            <p>Your cart is empty.</p>
            <a href="/">Go to Home</a>
        </div>
    </ng-template>
</div>
