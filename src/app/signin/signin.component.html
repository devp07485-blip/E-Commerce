<div class="signin-wrapper">
    <div class="signin-card">
        <div class="signin-header">
            <h2>Create Account</h2>
            <p>Sign up to get started</p>
        </div>

        <form (ngSubmit)="submit()">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Choose a username"
                    required />
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email"
                    required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password"
                    placeholder="Create a password" required />
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="phone-input-group">
                    <select id="country-code" [(ngModel)]="dropdownValue" (change)="onCountryChange()"
                        name="countryCode" required class="country-select">
                        <option value="">Code</option>
                        <option value="+91">+91</option>
                        <option value="+1">+1</option>
                        <option value="+44">+44</option>
                    </select>
                    <input type="tel" id="phone" [(ngModel)]="phone" name="phoneNumber" [placeholder]="phonePlaceholder"
                        [pattern]="phonePattern" required class="phone-field" />
                </div>
                <small>Format: {{ phonePlaceholder }}</small>
            </div>

            <button type="submit" class="signin-btn">Sign Up</button>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>
        </form>

        <div class="signin-footer">
            <p>Already have an account? <a routerLink="/login">Log in</a></p>
        </div>
    </div>
</div>
