<div class="Latest_Arrival">
    <h3><b>Latest Arrival</b> Men</h3>
    <div class="Mans" *ngFor="let n of latestMen">
        <img [src]="n.imageUrl" [alt]="n.name" />
        <div class="Name">{{ n.name }}</div>
        <div class="Price">{{ n.price | currency:'INR' }}</div>
        <button class="Hi" [routerLink]="['/details', n.id]">Details</button>
    </div>
</div>
