<div class="Latest">
    <h3><b>Latest</b> Arrival Women</h3>
    <div class="Arr">
        <div class="First" *ngFor="let p of latestWomen">
            <div class="Product_1">
                <img [src]="p.imageUrl" [alt]="p.name" />
                <div class="Name">{{ p.name }}</div>
                <div class="Price">{{ p.price | currency:'INR' }}</div>
                <button class="Hi" [routerLink]="['/details', p.id]">Details</button>
            </div>
        </div>
    </div>
</div>
